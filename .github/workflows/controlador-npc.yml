name: Compilar Controlador NPC separado
on:
  push:
    branches: [main]
    paths:
      - 'ControladorNPC/source/**'
      - 'ControladorNPC/tests/**'
      - 'build-npc/**'
      - '.github/workflows/controlador-npc.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: controlador-npc-${{ github.ref }}
  cancel-in-progress: true
jobs:
  compile:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Instalar runtime de testes Lua
        run: python -m pip install lupa
      - name: Compilar e validar controlador com SDK oficial
        shell: pwsh
        run: ./build-npc/compile-npc.ps1
      - name: Publicar RPK separado e canal próprio
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add releases/CONTROLADOR_NPC_STARWARS*.rpk releases/CONTROLADOR_NPC_STARWARS*_VALIDACAO.json ControladorNPC/update.txt
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { exit 0 }
          git commit -m 'Publica controlador NPC independente compilado pelo RDK'
          if ($LASTEXITCODE -ne 0) { throw 'Falha no commit' }
          git pull --rebase origin main
          if ($LASTEXITCODE -ne 0) { throw 'A branch mudou durante a publicação' }
          git push origin HEAD:main
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao publicar controlador' }
