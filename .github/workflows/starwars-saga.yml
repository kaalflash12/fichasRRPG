name: Compilar Star Wars Saga

on:
  push:
    branches: [main]
    paths:
      - 'StarWarsSaga/source.zip'
      - 'build/**'
      - '.github/workflows/starwars-saga.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: starwars-saga-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Instalar runtime de validação Lua
        run: python -m pip install lupa
      - name: Instalar RDK oficial e compilar
        shell: pwsh
        run: ./build/compile-starwars.ps1
      - name: Publicar pacote e canal validados
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add releases/*.rpk releases/*_VALIDACAO.json update.txt README.md
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { exit 0 }
          git commit -m 'Publica Star Wars Saga compilada pelo RDK'
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao criar commit de publicação' }
          git pull --rebase origin main
          if ($LASTEXITCODE -ne 0) { throw 'A branch mudou durante a publicação; revise antes de repetir' }
          git push origin HEAD:main
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao publicar pacote e canal' }
